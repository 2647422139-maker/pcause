name: ✨ 功能建议
description: 提出新能力或改进方向（先说明动机与场景，比直接给方案更容易被采纳）
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        pcause 的定位是**提示词因果解释器**（hunk 级反事实消融），不是提示词优化器、也不是通用 eval 平台——
        提建议前可先看 [README 的定位与已知限制](https://github.com/2647422139-maker/pcause#9-已知限制)。

  - type: textarea
    id: motivation
    attributes:
      label: 你遇到的实际问题
      description: 现在的工作流卡在哪一步？为什么现有命令/选项解决不了？
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 举一个具体例子（提示词规模、探针数量、是否 CI、使用哪个 provider）。
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的能力 / 方案
      description: 不必精确到命令名，说明输入输出与边界即可。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或绕行办法
      description: 你现在是怎么凑合解决的？也欢迎说明为什么不想再新增依赖（本项目坚持零依赖）。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这个需求落在这个工具的定位内（因果解释，而非自动优化/通用评测）
          required: true
