name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支同一工作流只保留一个运行：PR 上取消旧运行，main 上让旧运行跑完便于追踪
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 固定到显式镜像标签（不是 latest），消除 ubuntu-latest/windows-latest 跨 OS
        # 大版本迁移带来的「同一 commit 两次结果不同」噪音。注意：固定 label 不等于
        # 固定镜像快照，GitHub 仍会在同一 label 内滚动预装工具——只是不会跨大版本跳。
        # 升级节奏：① 关注 actions/runner-images 的 deprecation/brownout 公告；
        # ② 需要新预装工具或安全修复时，先在独立 PR 里把标签替换为候选版本跑一遍再合并。
        os: [ubuntu-24.04, windows-2022]
        node: ['20', '22']
        include:
          # Node 24 只在前瞻验证的 Linux 上跑，避免 Windows 24 偶发的 runner 不稳定
          - os: ubuntu-24.04
            node: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 零依赖项目没有 lockfile，缓存 node_modules 无意义；v5 默认开自动缓存，
          # 这里显式关掉，避免将来加了 packageManager 字段后行为悄悄变化。
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Offline selftest
        run: npm test

      - name: Release preflight (static checks)
        run: node scripts/preflight.mjs --no-tests

      - name: Packaging + install rehearsal (npm pack -> tmp install -> run bin)
        run: npm run pack-check -- --quiet
